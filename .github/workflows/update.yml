name: Update Mundial site

on:
  schedule:
    - cron: '3-59/10 * * * *' # poll off the busiest round minutes
  workflow_dispatch:           # lets you run it manually from the Actions tab
  push:
    branches: [ main ]
    paths-ignore:
      - 'index.html'
      - 'site_data.json'
      - 'scores.json'
      - 'results_store.json'
      - 'history.json'

permissions:
  contents: write

concurrency:
  group: mundial-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch results, score, rebuild site
        env:
          GATE_PASSWORD: ${{ secrets.GATE_PASSWORD }}
        run: python update.py
      - name: Commit updated data + site
        run: |
          git config user.name "mundial-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html site_data.json scores.json results_store.json history.json
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "Auto-update $(date -u +%F)"
            git push
          fi
