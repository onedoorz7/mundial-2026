<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>התערבות מונדיאל 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0a1733; --navy2:#15294f; --blue:#2e6fb8; --green:#11a35a; --green-d:#0a7a41;
  --gold:#ffc21c; --gold-d:#e0a000; --bg:#eef2f8; --card:#ffffff; --line:#e2e8f2;
  --txt:#15203a; --muted:#6b7790; --win:#e4f7ec; --miss:#fbe9e9; --exact:#fff3cf;
  --red:#e23b50; --teal:#19b6c9; --magenta:#d6307e;
  --radius:16px;
  --shadow:0 1px 2px rgba(16,32,64,.06),0 2px 8px rgba(16,32,64,.05);
  --shadow-lg:0 10px 30px rgba(16,32,64,.14);
  --safe-r:env(safe-area-inset-right,0px); --safe-l:env(safe-area-inset-left,0px);
  --site-header-h:96px; --main-nav-h:58px; --sticky-stack-h:154px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--txt);line-height:1.5;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit;text-decoration:none}
.wrap{max-width:1080px;margin:0 auto;
  padding-inline:max(16px,var(--safe-r)) max(16px,var(--safe-l))}
@media(max-width:560px){.wrap{padding-inline:max(13px,var(--safe-r)) max(13px,var(--safe-l))}}
@media(max-width:760px){:root{--site-header-h:66px;--sticky-stack-h:124px}}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:70;color:#fff;height:var(--site-header-h);padding:12px 0;overflow:hidden;
  background:linear-gradient(135deg,#0a1733 0%,#15294f 55%,#143f5e 100%);box-shadow:0 4px 16px rgba(8,18,40,.24)}
header::before{content:"";position:absolute;inset:0;opacity:.55;pointer-events:none;
  background:
    radial-gradient(circle at 12% 18%,rgba(214,48,126,.35),transparent 38%),
    radial-gradient(circle at 88% 12%,rgba(25,182,201,.32),transparent 40%),
    radial-gradient(circle at 70% 95%,rgba(255,194,28,.25),transparent 42%)}
header .wrap{position:relative;z-index:1;height:100%}
.htop{display:flex;align-items:center;justify-content:flex-start;height:100%;gap:14px}
.brand{display:flex;align-items:center;justify-content:flex-start;gap:14px;min-width:0}
.crest{width:56px;height:56px;border-radius:16px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:30px;
  background:linear-gradient(150deg,var(--gold),var(--gold-d));
  box-shadow:0 8px 22px rgba(255,194,28,.36);transform:rotate(-4deg)}
.title{display:flex;flex-direction:column;gap:5px;font-size:32px;font-weight:900;letter-spacing:0;line-height:1.02;text-align:right}
.title small{display:block;font-size:13px;font-weight:900;color:var(--gold);letter-spacing:2.3px;white-space:nowrap;text-transform:uppercase}
.hosts{font-size:14px;letter-spacing:1px;color:#fff}
.meta{display:none}
.fl{font-size:1.05em;line-height:1;margin-inline-end:5px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.12))}
.flsvg{margin-inline-end:5px;display:inline-block}
.flsvg svg{height:.8em;width:auto;vertical-align:-1px;border:.5px solid rgba(0,0,0,.18);border-radius:2px}
.team-ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.team-win{font-weight:700;color:var(--txt)}
.team-loss{font-weight:500;color:var(--muted)}
.team-pending{font-weight:500}

/* ---------- sticky nav ---------- */
.navbar{position:sticky;top:var(--site-header-h);z-index:60;min-height:var(--main-nav-h);
  background:linear-gradient(180deg,#0a1733,#0d1d3d);
  box-shadow:0 6px 18px rgba(8,18,40,.28);
  border-bottom:1px solid rgba(255,255,255,.06)}
.navbar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
  background:linear-gradient(90deg,var(--green),var(--gold),var(--red),var(--teal),var(--magenta))}
nav{display:flex;gap:6px;padding:9px 0;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
nav::-webkit-scrollbar{display:none}
nav button{background:transparent;border:none;color:#aebbd4;font-family:inherit;font-size:15px;
  font-weight:700;padding:9px 15px;cursor:pointer;border-radius:11px;transition:.15s;white-space:nowrap;flex-shrink:0}
nav button:hover{color:#fff;background:rgba(255,255,255,.08)}
nav button.active{background:linear-gradient(135deg,var(--gold),var(--gold-d));color:var(--navy);
  box-shadow:0 4px 12px rgba(255,194,28,.35)}

main{padding:22px 0 70px}
.view{display:none;animation:fade .25s}
.view.active{display:block}
#res.view.active{display:flex;flex-direction:column;min-height:0}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
h2.sec{font-size:clamp(17px,4.5vw,20px);font-weight:800;margin:10px 0 14px;display:flex;align-items:center;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden}
.fold{margin:0 0 16px}
.fold>summary{list-style:none;cursor:pointer;user-select:none}
.fold>summary::-webkit-details-marker{display:none}
.fold-title{font-size:clamp(17px,4.5vw,20px);font-weight:800;margin:10px 0 14px;display:flex;align-items:center;gap:8px}
.fold-title::before{content:"▾";font-size:14px;color:var(--muted);transition:transform .15s ease}
.fold:not([open]) .fold-title::before{transform:rotate(90deg)}
.fold-body{display:block}

/* ---------- table ---------- */
.tscroll{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--navy);color:#fff;font-weight:700;padding:11px 8px;text-align:center;font-size:13px}
td{padding:11px 8px;text-align:center;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#f7faff}
tr.clickable{cursor:pointer}
td.name{font-weight:700;text-align:right;color:var(--blue)}
.name-wrap{display:flex;align-items:center;gap:7px;justify-content:flex-start;min-width:0}
.name-wrap .name-text{min-width:0;overflow:hidden;text-overflow:ellipsis}
.winner-flag{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.winner-flag .fl,.winner-flag .flsvg{margin-inline-end:0}
.money-chip{display:inline-flex;align-items:center;justify-content:center;padding:2px 8px;border-radius:999px;
  background:#fff;color:var(--navy);border:1px solid #d8e0ec;font-size:11px;font-weight:900;
  line-height:1.4;white-space:nowrap;box-shadow:0 1px 3px rgba(10,23,51,.13)}
.money-chip.p1{background:#fff7d8;color:#8a5f00;border-color:#e1ad00}
.money-chip.p2{background:#f7f9fc;color:#4c5b70;border-color:#a8b4c5}
.money-chip.p3{background:#fff4ea;color:#8b4c18;border-color:#c78349}
.money-chip.last{background:#fff0f1;color:#a92f3d;border-color:#e28b94}
.gb-icon{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;
  color:var(--gold);filter:drop-shadow(0 1px 1px rgba(138,95,0,.24));flex-shrink:0}
.gb-icon svg{display:block;width:100%;height:100%;transform:rotate(-16deg);transform-origin:center}
.gb-cleat-outline{fill:none;stroke:#7b5400;stroke-width:1.5;stroke-linejoin:round}
.gb-cleat{fill:var(--gold);stroke:#ffd75a;stroke-width:.35;stroke-linejoin:round}
.tot-wrap{direction:ltr;unicode-bidi:isolate;display:inline-flex;align-items:center;justify-content:center;gap:3px}
.tot-wrap.has-gb{position:relative}
.gb-mobile-total{display:none}
.lb-gb-note{display:none}
.tot{font-weight:900;font-size:16px}
.rk-badge{display:inline-flex;align-items:center;justify-content:center;width:27px;height:27px;
  border-radius:50%;font-weight:800;font-size:13px;background:#eef2f9}
#lb .card{overflow-x:auto}
#lb table{min-width:980px}
/* rank-tinted rows: gold / silver / bronze / last */
tr.top1 td{background:linear-gradient(90deg,rgba(255,194,28,.22),rgba(255,194,28,.07))}
tr.top2 td{background:rgba(168,184,206,.22)}
tr.top3 td{background:rgba(205,127,80,.16)}
tr.last  td{background:rgba(226,59,80,.11)}
tr.top1:hover td,tr.top2:hover td,tr.top3:hover td,tr.last:hover td{filter:brightness(.97)}
tr.top1 .rk-badge{background:linear-gradient(135deg,var(--gold),var(--gold-d));color:#fff}
tr.top2 .rk-badge{background:linear-gradient(135deg,#c9d2e0,#a6b3c6);color:#fff}
tr.top3 .rk-badge{background:linear-gradient(135deg,#d49a6a,#b5763f);color:#fff}
tr.last  .rk-badge{background:linear-gradient(135deg,#e8868f,#cf5560);color:#fff}

/* ---------- bars ---------- */
.bar-row{display:flex;align-items:center;gap:10px;margin:8px 0}
.bar-name{width:clamp(96px,28vw,150px);font-weight:600;font-size:14px;text-align:left;flex-shrink:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;background:#eef2f9;border-radius:8px;height:26px;position:relative;overflow:hidden}
.bar-fill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--green),var(--green-d));
  display:flex;align-items:center;justify-content:flex-start;padding:0 9px;color:#fff;font-weight:800;font-size:13px;
  min-width:26px;transition:width .4s ease}
.bar-fill.gold{background:linear-gradient(90deg,var(--gold),var(--gold-d))}
.scorer-card{margin-bottom:18px}
.scorer-grid{width:100%;overflow:hidden}
.scorer-row{display:grid;grid-template-columns:50px minmax(0,1fr) 62px 78px;align-items:center;border-bottom:1px solid var(--line)}
.scorer-row:last-child{border-bottom:none}
.scorer-row.head{background:var(--navy);color:#fff;font-weight:700;font-size:13px}
.scorer-row>div{padding:11px 8px;text-align:center;min-width:0}
.scorer-row .player{text-align:right;font-weight:800;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scorer-row.head .player{color:#fff;text-align:center}
.scorer-player{direction:ltr;unicode-bidi:isolate;display:inline-flex;align-items:center;gap:6px;max-width:100%;vertical-align:middle}
.scorer-name{min-width:0;overflow:hidden;text-overflow:ellipsis}
.scorer-short{display:none}
.scorer-num{font-weight:900;color:var(--txt)}
@media(max-width:560px){
  .scorer-card{overflow:hidden}
  .scorer-row{grid-template-columns:34px minmax(0,1fr) 40px 54px}
  .scorer-row>div{padding:9px 4px;font-size:12px}
  .scorer-card .rk-badge{width:28px;height:28px}
  .scorer-row .player{text-align:right}
  .scorer-player{max-width:100%}
  .scorer-full{display:none}
  .scorer-short{display:inline}
}

/* ---------- results grid ---------- */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:11px}
.match{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 14px;box-shadow:var(--shadow);cursor:pointer;transition:.15s;scroll-margin-top:74px}
.match:hover{border-color:var(--blue);box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.match.live{border-color:var(--red);box-shadow:0 0 0 1px rgba(226,59,80,.11),var(--shadow)}
.match.live:hover{border-color:var(--red);box-shadow:0 8px 22px rgba(226,59,80,.16)}
.match.up{background:#fbfdff;border-color:#d9e2ee;box-shadow:0 1px 2px rgba(16,32,64,.04)}
.match.up:hover{border-color:#b8c9df;box-shadow:var(--shadow);transform:none}
.match.no-click{cursor:default}
.match.no-click:hover{border-color:var(--line);box-shadow:var(--shadow);transform:none}
.mtap{margin-top:9px;text-align:center;font-size:11px;font-weight:800;color:var(--blue);border-top:1px dashed var(--line);padding-top:7px}
.match.up .mtap{color:var(--muted)}
.mtap.no-guess{color:var(--muted)}
.match .mh{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;font-size:11px;color:var(--muted);margin-bottom:7px}
.match .mh-date{text-align:left}
.match .mh-num{text-align:right}
.match .mh-live{text-align:center;color:var(--red)}
.match .teams{display:grid;grid-template-columns:minmax(0,1fr) 58px minmax(0,1fr);align-items:center;gap:7px;font-weight:700;font-size:14px;direction:ltr}
.match .teams>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.match .teams>span:first-child{text-align:left}
.match .teams>span:last-child{text-align:right}
.match .teams .team-ltr{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
.match .teams>span.team-win{font-weight:700;color:var(--navy)}
.match .teams>span.team-loss{font-weight:500;color:var(--muted)}
.match .teams>span.team-pending{font-weight:500;color:var(--txt)}
.match .sc{background:var(--navy);color:#fff;border-radius:8px;padding:3px 10px;font-weight:800;min-width:48px;text-align:center;direction:ltr;unicode-bidi:bidi-override;flex-shrink:0}
.score-ltr{direction:ltr;unicode-bidi:bidi-override;display:inline-block}
.match.up .sc{background:#d7dfec;color:#41516a}
#res .match{scroll-margin-top:56px}
.outcome-split{width:min(74%,340px);margin:8px auto 0;display:flex;align-items:center;justify-content:center;direction:ltr}
.outcome-seg{height:20px;display:inline-flex;align-items:center;justify-content:center;gap:5px;
  padding:0 12px;color:#778399;font-size:11px;font-weight:700;line-height:1;white-space:nowrap}
.outcome-seg+.outcome-seg{border-inline-start:1px solid #dfe6f0}
.outcome-seg.fav{color:var(--navy);font-weight:900}
.outcome-seg.correct{color:var(--green-d);font-weight:900}
.outcome-seg .mark{display:inline-flex;align-items:center;color:inherit;opacity:.9}
.outcome-seg .mark .fl,.outcome-seg .mark .flsvg{margin-inline-end:0}
.outcome-seg .pct{font-size:12px;color:inherit}
.outcome-split.ko{width:min(86%,380px)}
.live-chip{color:var(--red);font-weight:400}

/* ---------- browse ---------- */
.form-head{margin-bottom:12px}
.form-person{min-width:0;position:relative}
.form-person::after{content:"";position:absolute;left:17px;top:50%;width:7px;height:7px;
  border-left:1.75px solid var(--navy);border-bottom:1.75px solid var(--navy);transform:translateY(-68%) rotate(-45deg);
  pointer-events:none}
.form-person select{width:100%;height:42px;border:1px solid var(--line);border-radius:12px;background:#fff;
  font-family:inherit;font-size:15px;font-weight:800;color:var(--txt);padding:0 12px 0 42px;box-shadow:var(--shadow);
  appearance:none;-webkit-appearance:none}
.psum{display:flex;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:13px;
  box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.pick-kpi{min-width:0;display:grid;grid-template-rows:auto 1fr;justify-items:center;align-items:center;gap:3px;
  padding:8px 14px;line-height:1.15;text-align:center}
.pick-kpi+.pick-kpi{border-inline-start:1px solid var(--line)}
.pick-kpi .k{font-size:12px;color:var(--muted);font-weight:800;white-space:nowrap;align-self:start}
.pick-kpi .v{font-size:clamp(14px,3.4vw,16px);font-weight:900;min-width:0;max-width:100%;white-space:normal}
.pick-kpi{flex:1 1 0}
.rank-v{display:inline-flex;align-items:center;justify-content:center;width:27px;height:27px;border-radius:9px;
  background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;font-size:17px;font-weight:900}
.pick-kpi.scorers .v{font-size:14px;line-height:1.25}
.gs-line{display:block}
.brk{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:18px}
.stage-chip{background:var(--card);border:1px solid #d7e0ec;border-radius:10px;padding:8px 10px;text-align:center;
  line-height:1.15;box-shadow:0 1px 2px rgba(16,32,64,.05),0 4px 12px rgba(16,32,64,.06)}
.stage-chip .label{display:block;color:var(--muted);font-size:12px;font-weight:800;margin-bottom:4px;white-space:nowrap}
.stage-chip .pts{display:block;color:var(--green-d);font-size:18px;font-weight:900}
.stage-chip .unit{font-size:11px;font-weight:800;color:var(--muted);margin-inline-start:2px}
.stage-tabs{display:flex;gap:4px;margin:0 0 14px;padding:5px;background:#dfe7f2;border:1px solid #cfd9e8;border-radius:13px;
  overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;box-shadow:inset 0 1px 2px rgba(10,23,51,.05)}
#res .stage-tabs{position:sticky;top:var(--sticky-stack-h);z-index:45;gap:0;margin:-22px calc(-1 * max(16px,var(--safe-r))) 14px calc(-1 * max(16px,var(--safe-l)));
  padding:0 max(16px,var(--safe-r)) 0 max(16px,var(--safe-l));height:48px;align-items:stretch;
  background:rgba(235,240,248,.98);border:none;border-bottom:1px solid #d3dbea;border-radius:0;
  box-shadow:0 5px 12px rgba(16,32,64,.09);backdrop-filter:blur(8px)}
.stage-tabs::-webkit-scrollbar{display:none}
.stage-tab,.result-stage-tab{border:none;background:transparent;color:#52617a;font-family:inherit;font-size:13px;font-weight:900;
  border-radius:9px;padding:8px 13px;white-space:nowrap;cursor:pointer;transition:.15s;flex-shrink:0}
#res .result-stage-tab{position:relative;flex:1 0 auto;min-width:132px;display:flex;align-items:center;justify-content:center;
  background:transparent;border:none;border-radius:0;color:#8a95ab;font-size:13px;padding:0 10px;box-shadow:none}
.stage-tab:hover,.result-stage-tab:hover{background:rgba(255,255,255,.48);color:var(--navy)}
.stage-tab.active,.result-stage-tab.active{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;box-shadow:0 3px 9px rgba(10,23,51,.22)}
#res .result-stage-tab:hover{background:rgba(255,255,255,.32);color:#53617a}
#res .result-stage-tab.active{background:transparent;border:none;color:var(--navy);box-shadow:none}
#res .result-stage-tab.active::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:4px;
  border-radius:4px 4px 0 0;background:var(--gold)}
.form-stage-divider{height:1px;margin:0 4px 14px;background:linear-gradient(90deg,transparent,#cfd9e8 18%,#cfd9e8 82%,transparent)}
.stage-panel{display:none}
.stage-panel.active{display:block}
.result-stage-panels{overflow-y:auto;-webkit-overflow-scrolling:touch;max-height:calc(100dvh - var(--sticky-stack-h) - 96px);padding:0 2px 18px;scrollbar-width:thin}
.result-stage-panel{display:none}
.result-stage-panel.active{display:block}
.stage-status-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-bottom:14px;align-items:start}
.stage-status-card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.stage-status-card.guaranteed{border-color:#bfe6cd;background:linear-gradient(180deg,#f4fbf7,#fff)}
.stage-status-card.pending{border-color:#d7e0ec}
.stage-status-card.eliminated{border-color:#f0b6bc;background:linear-gradient(180deg,#fff5f5,#fff)}
.stage-status-card>summary{list-style:none;cursor:pointer;user-select:none}
.stage-status-card>summary::-webkit-details-marker{display:none}
.stage-status-head{display:flex;align-items:center;justify-content:flex-start;gap:8px;padding:9px 11px;border-bottom:1px solid var(--line);
  font-size:12px;font-weight:900;color:var(--navy)}
.stage-status-head::before{content:"▾";font-size:12px;color:var(--muted);transition:transform .15s ease;order:3;margin-inline-start:auto}
.stage-status-card:not([open]) .stage-status-head{border-bottom:none}
.stage-status-card:not([open]) .stage-status-head::before{transform:rotate(90deg)}
.stage-status-count{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;border-radius:999px;background:#eef2f9;color:var(--navy);
  font-size:12px;font-weight:900;padding:0 8px}
.stage-team-list{display:flex;flex-direction:column;gap:6px;padding:10px;min-height:50px}
.stage-status-note{color:var(--muted);font-size:11px;font-weight:800;line-height:1.45;padding:0 2px 3px;text-align:right}
.stage-team-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 9px;border-radius:9px;background:#f7faff;
  font-size:12px;font-weight:800;min-width:0}
.stage-team-row .team-ltr{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
.stage-team-row.eliminated{background:#fff0f1;color:#a92f3d}
.stage-team-row.guaranteed{background:#e4f7ec;color:var(--green-d)}
.stage-team-row.pending{background:#f7faff;color:var(--txt)}
.stage-pct{flex-shrink:0;border-radius:999px;background:#fff;border:1px solid #d8e0ec;color:var(--navy);font-size:11px;font-weight:900;padding:2px 7px}
.stage-games-title{font-size:14px;font-weight:900;margin:2px 0 9px;color:var(--navy)}
.stage-games{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-bottom:14px}
.stage-game{background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);overflow:hidden}
.stage-game-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;color:var(--muted);font-size:11px;font-weight:500;padding:12px 14px 9px}
.stage-game-date{text-align:left;direction:ltr}
.stage-game-num{text-align:right}
.stage-game-line{padding:12px 14px}
.stage-game-line.predicted{background:#eef5ff}
.stage-game-line.actual{background:#effaf3;padding-top:15px}
.stage-game-actual-label{position:relative;height:0;text-align:center;z-index:1}
.stage-game-actual-label>span{position:relative;top:-11px;display:inline-block;background:#f6f9fe;color:#52617a;font-size:10px;font-weight:600;line-height:16px;padding:0 9px;border:1px solid #d8e0ec;border-radius:999px}
.stage-game-row{display:grid;grid-template-columns:minmax(0,1fr) 58px minmax(0,1fr);align-items:center;gap:7px;font-size:14px;font-weight:500;direction:ltr}
.stage-game-row>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stage-game-row>span:first-child{text-align:left}
.stage-game-row>span:last-child{text-align:right}
.stage-game-row .team-ltr{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
.stage-game-row .team-win{font-weight:700;color:var(--navy)}
.stage-game-row .team-loss{font-weight:500;color:var(--txt)}
.stage-game-score{background:var(--navy);color:#fff;border-radius:8px;padding:3px 10px;font-weight:900;min-width:48px;text-align:center;direction:ltr;unicode-bidi:bidi-override}
.stage-game-line.actual .stage-game-score{background:#e4eaf3;color:#41516a}
.stage-standings{margin-top:2px}
.bracket{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:8px;margin-bottom:8px}
.bcol h4{font-size:12px;text-align:center;color:var(--muted);margin-bottom:8px;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.bmatch{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:7px;overflow:hidden;font-size:12px;box-shadow:var(--shadow)}
.bteam{display:flex;justify-content:space-between;gap:5px;padding:6px 8px;border-bottom:1px solid var(--line)}
.bteam:last-child{border-bottom:none}
.bteam.w{background:var(--win);font-weight:800}
.bteam span.s{font-weight:800;flex-shrink:0}
.minicol{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.gcompare{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;margin-bottom:6px}
.gpair{background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);overflow:hidden}
.gpair-title{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 11px;background:#f6f9fd;border-bottom:1px solid var(--line)}
.gpair-name{font-size:13px;font-weight:900;color:var(--navy)}
.gpair-tables{display:grid;grid-template-columns:1fr 1fr;gap:0}
.gpair-tables .gtable+.gtable{border-inline-start:1px solid var(--line)}
.gtable{font-size:12px;min-width:0}
.gtable .gh{background:var(--blue);color:#fff;font-weight:800;padding:6px 9px;font-size:12px}
.gtable .gh.actual{background:linear-gradient(135deg,var(--green),var(--green-d))}
.gtable .gh.pred{background:linear-gradient(135deg,var(--blue),#1f5797)}
.gtable table{width:100%;table-layout:fixed;font-size:11.5px}
.gpts-col{width:28px}
.gtable td{padding:6px 5px}
.gtable tr.q td{background:var(--win)}
.gteam{display:flex;align-items:center;gap:5px;text-align:right;font-weight:700;line-height:1.25;white-space:nowrap;min-width:0}
.gplace{flex-shrink:0}
.gteam-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gteam-name .team-ltr{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gpts{width:26px;text-align:center;font-weight:900;white-space:nowrap}
.gtable.actual tr.q td{background:#e7f7ee}
.gtable.pred tr.q td{background:#e8f1fb}
.third-compare{max-width:660px;margin:0 auto 8px}
.third-table .gteam{font-size:12px}
.third-table table{font-size:12.5px}
.third-table td{padding:8px 6px}
.mtable{direction:ltr}
.mtable td.h{text-align:right;font-weight:600}
.mtable td.a{text-align:left;font-weight:600}
.mtable td.team-win{font-weight:700;color:var(--navy)}
.mtable td.team-loss{font-weight:500;color:var(--muted)}
.mtable td.team-pending{font-weight:500}
.pp{font-weight:800;border-radius:6px;padding:2px 6px;font-size:11px;display:inline-block}
.pp.p3{background:var(--exact);color:#9a7400}.pp.p2{background:var(--exact);color:#9a7400}
.pp.p1{background:var(--win);color:var(--green-d)}.pp.p0{background:var(--miss);color:#b53b3b}

/* ---------- gate ---------- */
.gate{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#0a1733,#15294f);padding:16px}
.gate[hidden]{display:none}
.gate::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;
  background:linear-gradient(90deg,var(--green),var(--gold),var(--red),var(--teal),var(--magenta))}
.gate-box{background:#fff;border-radius:18px;padding:34px 30px;text-align:center;width:min(340px,92vw);
  box-shadow:0 24px 70px rgba(0,0,0,.45);position:relative}
.gate-crest{font-size:44px}
.gate-box h1{font-size:20px;margin:6px 0 2px}
.gate-box .hosts2{font-size:16px;letter-spacing:2px;margin:4px 0 2px}
.gate-box p{color:var(--muted);font-size:13px;margin:8px 0 16px}
.gate-box input{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:11px;
  font-family:inherit;font-size:16px;text-align:center}
.gate-box input:focus{outline:none;border-color:var(--blue)}
.gate-box button{width:100%;margin-top:10px;padding:13px;border:none;border-radius:11px;
  background:var(--navy);color:#fff;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer}
.gate-box button:hover{background:var(--navy2)}
.gate-err{color:var(--red);font-size:13px;margin-top:9px;min-height:18px;font-weight:700}
.collapse-row td{padding:0;border:none}
.detail{background:#f7faff;padding:12px 16px;font-size:13px}

/* ---------- payments / shame ---------- */
.pay-hero{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:18px}
.pay-stat{border-radius:14px;padding:18px 12px;text-align:center;color:#fff;box-shadow:var(--shadow)}
.pay-stat .v{font-size:clamp(26px,8vw,34px);font-weight:900;line-height:1}
.pay-stat .k{font-size:13px;font-weight:700;margin-top:5px;opacity:.96}
.pay-stat.ok{background:linear-gradient(135deg,var(--green),var(--green-d))}
.pay-stat.bad{background:linear-gradient(135deg,#e23b50,#b5293b)}
.trend-summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.trend-card{border-radius:10px;padding:12px 14px;color:#fff;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;min-height:78px;text-align:right}
.trend-card.up{background:linear-gradient(135deg,var(--green),var(--green-d))}
.trend-card.down{background:linear-gradient(135deg,#e23b50,#b5293b)}
.trend-card .trend-title{font-size:12px;font-weight:800;line-height:1.25;opacity:.92}
.trend-card .trend-main{font-size:clamp(19px,3vw,24px);font-weight:900;line-height:1.2}
.trend-card .trend-meta{font-size:12px;font-weight:700;line-height:1.45;opacity:.94}
.shame-wall{background:linear-gradient(135deg,#fff5f5,#ffe9ea);border-color:#f3c2c7}
.honor-roll{background:linear-gradient(135deg,#f1fbf5,#e4f7ec);border-color:#bfe6cd}
.namegrid{display:flex;flex-wrap:wrap;gap:9px;padding:15px}
.ntag{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:8px 14px;font-size:14px;font-weight:700;background:#fff}
.ntag.bad{border:1px solid #f0b6bc;color:#b5293b}
.ntag.ok{border:1px solid #bfe6cd;color:var(--green-d)}
.pay-note{background:#fff8e6;border:1px solid #ffe2a8;border-radius:12px;padding:13px 15px;font-size:13px;font-weight:600;margin-top:16px;text-align:center;line-height:1.7}
.pay-note b{color:var(--gold-d)}
.allpaid{text-align:center;padding:34px 16px;font-size:clamp(17px,5vw,20px);font-weight:800;color:var(--green-d)}
.pay-upd{text-align:center;color:var(--muted);font-size:12px;margin-top:12px}

/* ---------- match-bets modal ---------- */
.modal{position:fixed;inset:0;z-index:200;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(8,16,34,.55);backdrop-filter:blur(2px)}
.modal[hidden]{display:none}
.modal-card{background:var(--card);width:100%;max-width:560px;max-height:88vh;overflow:hidden;
  display:flex;flex-direction:column;border-radius:20px 20px 0 0;position:relative;
  box-shadow:0 -12px 44px rgba(0,0,0,.32);animation:slideup .25s}
@keyframes slideup{from{transform:translateY(34px);opacity:.5}to{transform:translateY(0);opacity:1}}
@media(min-width:560px){.modal{align-items:center;padding:16px}.modal-card{border-radius:20px}}
.modal-x{position:absolute;top:13px;inset-inline-start:13px;width:34px;height:34px;border:none;border-radius:50%;
  background:rgba(255,255,255,.85);font-size:15px;cursor:pointer;color:var(--navy);z-index:3;font-weight:800}
#modal-body{display:flex;flex:1;flex-direction:column;min-height:0}
.modal-head{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:22px 16px 18px;text-align:center;
  flex-shrink:0;border-radius:20px 20px 0 0}
@media(min-width:560px){.modal-head{border-radius:20px 20px 0 0}}
.mm-teams{display:flex;align-items:center;justify-content:center;gap:12px;font-weight:800;font-size:16px;direction:ltr}
.mm-teams .team-loss{color:#c2cfe6;font-weight:500}
.mm-teams .team-win{color:#fff;font-weight:700}
.mm-teams .team-pending{color:#fff;font-weight:500}
.mm-sc{background:var(--gold);color:var(--navy);border-radius:9px;padding:3px 13px;font-weight:900;direction:ltr;unicode-bidi:bidi-override}
.mm-sc.up{background:rgba(255,255,255,.2);color:#fff}
.mm-sub{font-size:12px;color:#c2cfe6;margin-top:8px}
.mm-live{display:inline-flex;align-items:center;gap:6px;margin-inline-start:6px;padding:3px 9px;border-radius:999px;
  background:rgba(226,59,80,.14);border:1px solid rgba(226,59,80,.42);color:#fff;font-weight:800;line-height:1}
.mm-live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px rgba(226,59,80,.18)}
.mm-live::after{content:"LIVE";color:var(--red);font-size:10px;font-weight:900;letter-spacing:.5px;order:-1}
.mm-stats{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;padding:13px 14px 2px;flex-shrink:0}
.mm-list{flex:1;padding:8px 14px 20px;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}
.mm-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.mm-row:last-child{border-bottom:none}
.mm-rank{font-size:12px;font-weight:800;color:var(--muted);min-width:20px;text-align:center}
.mm-name{flex:1;font-weight:700;font-size:14px;color:var(--blue);cursor:pointer}
.mm-pred{font-weight:800;font-size:14px;background:#eef2f9;border-radius:7px;padding:3px 10px;min-width:48px;text-align:center}
.mm-empty{padding:28px 18px 34px;text-align:center;color:var(--muted);font-size:14px;font-weight:800;line-height:1.7}

/* ---------- statistics + trends ---------- */
.stats-card .muted-note{padding:12px 14px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);line-height:1.6}
.stats-card{overflow-x:auto}
.stats-card table{table-layout:fixed;min-width:980px}
.stats-card col.stat-place{width:5%}
.stats-card col.stat-name{width:18%}
.stats-card col.stat-num{width:var(--stat-num-w)}
.stats-card th.sortable{cursor:pointer;user-select:none}
.stats-card th.sortable:hover{background:var(--navy2)}
.sort-mark{display:inline-block;min-width:14px;margin-inline-start:3px;color:var(--gold)}
.stats-card td.num{font-weight:900;font-size:16px;color:var(--navy)}
.stats-card td.callout{color:#9a7400}
.empty-state{padding:24px;text-align:center;color:var(--muted);font-size:14px;line-height:1.7}
.mv{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;min-width:30px;
  padding:4px 7px;border-radius:999px;font-size:10px;font-weight:900;line-height:1;
  white-space:nowrap;direction:ltr;unicode-bidi:isolate}
.mv.up{background:#e3f5e9;color:var(--green-d)}
.mv.down{background:#fde8ea;color:var(--red)}
.trend-chart-card{padding:14px;overflow:hidden}
.trend-chart-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.trend-focus{font-weight:900;color:var(--navy);font-size:15px;line-height:1.45}
.trend-focus-note{color:var(--muted);font-weight:800}
.trend-picker{display:none;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--navy);font-family:inherit;font-weight:800;font-size:13px;padding:7px 9px;max-width:100%}
.trend-selected-note{display:none;color:var(--muted);font-size:11px;font-weight:800;line-height:1.4;margin:7px 8px 0;text-align:right}
.trend-chart-scroll{overflow-x:auto;direction:ltr;border:1px solid var(--line);border-radius:10px;background:#fff}
.trend-chart{display:block;min-width:900px;width:100%;height:auto}
.trend-grid{stroke:#e8edf6;stroke-width:1}
.trend-axis{stroke:#bcc8da;stroke-width:1.2}
.trend-axis-label{fill:#64748b;font-size:11px;font-weight:800}
.trend-date-label{fill:#64748b;font-size:10px;font-weight:800}
.trend-line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;opacity:.34;transition:opacity .16s,stroke-width .16s}
.trend-dot{opacity:.72;transition:opacity .16s,r .16s}
.trend-hit{fill:none;stroke:transparent;stroke-width:13;stroke-linecap:round;cursor:pointer}
.trend-label-guide{stroke:#bcc8da;stroke-width:1;opacity:.45}
.trend-end-label{font-size:10px;font-weight:900;cursor:pointer;dominant-baseline:middle}
.trend-chart-card.has-focus .trend-line{opacity:.14}
.trend-chart-card.has-focus .trend-dot{opacity:.18}
.trend-chart-card.has-focus .trend-label-guide{opacity:.14}
.trend-chart-card.has-focus .trend-end-label{opacity:.28}
.trend-chart-card.has-focus .trend-line.active{opacity:1;stroke-width:4}
.trend-chart-card.has-focus .trend-dot.active{opacity:1}
.trend-chart-card.has-focus .trend-label-guide.active{opacity:.85;stroke-width:1.4}
.trend-chart-card.has-focus .trend-end-label.active{opacity:1}
.trend-chart-card .pay-upd{margin-top:10px}

/* ---------- rules ---------- */
.rules-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.rule-card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px 15px;min-width:0}
.rule-title{font-size:15px;font-weight:900;color:var(--navy);margin-bottom:9px}
.rule-list{display:flex;flex-direction:column;gap:8px;color:var(--txt);font-size:13px;font-weight:700;line-height:1.55}
.rule-item{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed #dbe4f0;padding-bottom:7px}
.rule-item:last-child{border-bottom:none;padding-bottom:0}
.rule-points{flex-shrink:0;color:var(--green-d);font-weight:900;white-space:nowrap}
.rules-note{margin-top:12px;color:var(--muted);font-size:12px;font-weight:800;line-height:1.8;text-align:center}

/* ---------- responsive ---------- */
@media(max-width:760px){
  header{padding:7px 0}
  .htop{justify-content:flex-start;gap:9px}
  .brand{justify-content:flex-start;gap:9px}
  .crest{width:36px;height:36px;border-radius:12px;font-size:19px;box-shadow:0 5px 14px rgba(255,194,28,.34)}
  .title{gap:1px;font-size:clamp(17px,4.4vw,21px);line-height:1.08;justify-content:center}
  .title small{font-size:10.5px;line-height:1.2;letter-spacing:1.1px}
  .hosts{font-size:12px;letter-spacing:1px}
  .meta{text-align:right;width:100%}
  .trend-summary{grid-template-columns:1fr;gap:7px;margin-bottom:10px}
  .trend-card{min-height:0;padding:8px 10px;gap:1px}
  .trend-card .trend-main{font-size:clamp(12px,3.8vw,14px);line-height:1.2}
  .trend-card .trend-title{font-size:10px}
  .trend-card .trend-meta{font-size:9.5px;line-height:1.3}
  .trend-chart-card{padding:10px}
  .trend-chart-head{margin-bottom:7px;display:block}
  .trend-focus{display:none}
  .trend-picker{display:block;width:100%}
  .trend-selected-note{display:block;font-size:10.5px}
  .trend-chart-scroll{overflow:hidden}
  .trend-chart{min-width:0}
  .trend-end-label{font-size:7.2px}
}
@media(max-width:640px){
  .bracket{grid-template-columns:repeat(6,150px)}
}
@media(max-width:560px){
  table{font-size:13px}
  th,td{padding:9px 6px}
  .form-person select{height:38px;font-size:14px}
  .pick-kpi{padding:7px 8px;gap:3px}
  .pick-kpi .k{font-size:11px}.pick-kpi .v{font-size:13px}.rank-v{width:24px;height:24px;border-radius:8px;font-size:15px}
  .pick-kpi.scorers .v{font-size:13px}
  .brk{gap:5px}.stage-chip{padding:7px 5px}.stage-chip .label{font-size:10px}.stage-chip .pts{font-size:16px}.stage-chip .unit{font-size:10px}
  .stage-tabs{gap:4px;margin-bottom:11px;padding:4px}
  .stage-tab,.result-stage-tab{font-size:12px;padding:7px 10px}
  .stage-status-grid{grid-template-columns:1fr;gap:8px}
  .stage-team-list{padding:8px}
  .stage-games{grid-template-columns:1fr;gap:8px}
  .gcompare{grid-template-columns:1fr;gap:12px}
  .gpair-tables{grid-template-columns:1fr 1fr}
  .gpair-tables .gtable+.gtable{border-inline-start:1px solid var(--line);border-top:none}
  .gtable table{font-size:12.5px}
  .gtable .gh{padding:6px 7px}
  .gtable td{padding:7px 5px}
  .gteam{font-size:12px}
  .gpts{width:22px;font-size:12px}
  /* leaderboard: keep rank · name · total, fold the breakdown columns away */
  #lb table{min-width:0}
  #lb table th:nth-child(n+3):not(:last-child),
  #lb table td:nth-child(n+3):not(:last-child){display:none}
  #lb .lb-gb-note{display:flex;align-items:center;justify-content:flex-start;gap:6px;margin:-14px 0 8px;color:#52627a;font-size:12px;font-weight:800;line-height:1.35;direction:rtl;text-align:right}
  #lb .gb-mobile-total{display:inline-flex;position:absolute;top:-6px;left:-9px}
  #lb .tot .gb-icon{width:12px;height:12px;filter:drop-shadow(0 1px 1px rgba(138,95,0,.24))}
  /* let the wider tables scroll instead of squashing */
  #gb .card,#forms .card{overflow-x:auto;-webkit-overflow-scrolling:touch}
  #gb .card table,#forms .mtable{min-width:440px}
  #stats .card{overflow:hidden}
  #stats table{width:100%;min-width:0;font-size:11px;table-layout:fixed}
  #stats .stats-card colgroup{display:none}
  #stats th,#stats td{padding:8px 3px}
  #stats .stats-card th:first-child,#stats .stats-card td:first-child{width:34px}
  #stats .stats-card th:nth-child(2),#stats .stats-card td:nth-child(2){width:30%}
  #stats .stats-card th:nth-child(n+3),#stats .stats-card td:nth-child(n+3){width:auto}
  #stats .stats-card col.stat-place{width:34px}
  #stats .stats-card col.stat-name{width:30%}
  #stats .stats-card col.stat-num{width:auto}
  #stats .stats-card col.stat-hide-mobile{width:0;visibility:collapse}
  #stats .stats-card th:nth-child(4),#stats .stats-card td:nth-child(4),
  #stats .stats-card th:nth-child(5),#stats .stats-card td:nth-child(5){display:none}

  if(!parts) return null;
  const month=/^Jul/i.test(parts[1]) ? 6 : 5;
  return new Date(+(parts[3]||2026), month, +parts[2]).getTime();
}
function todayValue(){
  const now=new Date();
  return new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
}
function calendarStageForDate(value){
  const d=new Date(value);
  const month=d.getMonth()+1, day=d.getDate();
  if(month===7 && day>=19) return 'final';
  if(month===7 && day===18) return 'third';
  if(month===7 && day>=14) return 'sf';
  if(month===7 && day>=9) return 'qf';
  if(month===7 && day>=4) return 'r16';
  if((month===6 && day>=28) || month===7) return 'r32';

}
function stageOrderValue(key){

const escAttr = s => String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const hasResult = m => !!(m && (m.played || m.live));

const scoreParts = score => {

};
const sideResultClass = (homeScore, awayScore, side) => {
  if(homeScore == null || awayScore == null || homeScore === awayScore) return '';

const matchSideClass = (m, side) => hasPoints(m) ? sideResultClass(m.hs, m.as, side) : 'team-pending';

function currentMatchPts(pred, actual){
  const pm=String(pred||'').match(/^(\d+)-(\d+)$/), am=String(actual||'').match(/^(\d+)-(\d+)$/);
  if(!pm||!am)return 0;
  const hg=+pm[1], ag=+pm[2], hs=+am[1], as=+am[2];

let curResultStage=null;
function renderRes(){
  const v=$('#res'); v.innerHTML='';

function resultStages(){
  return STAGES.filter(s=>s.key==='group' || resultMatchesForStage(s.key).length);
}

function visibleResultStage(preferred){
  const stages=resultStages();
  if(stages.some(s=>s.key===preferred)) return preferred;
  if(stages.some(s=>s.key===curResultStage)) return curResultStage;
  return stages[stages.length-1]?.key || 'group';
}

function resultMatchesForStage(stageKey){
  if(stageKey==='group') return D.results||[];
  return (D.knockout_results||[]).filter(m=>m.stage===stageKey);
}

function allResultMatches(){
  return [...(D.results||[]), ...(D.knockout_results||[])];
}

function matchStageKey(m){
  return m && m.stage ? m.stage : 'group';
}

function currentCompetitionStage(){
  const live=allResultMatches().find(m=>m.live);
  if(live) return matchStageKey(live);
  const today=todayValue();
  let active=calendarStageForDate(today);
  ['group','r32','r16','qf','sf','third','final'].forEach(stageKey=>{
    const s=STAGES.find(x=>x.key===stageKey);
    if(!s) return;
    const firstDate=Math.min(...resultMatchesForStage(s.key).map(matchDateValue).filter(v=>v!=null));
    if(Number.isFinite(firstDate) && firstDate<=today && stageOrderValue(s.key)>stageOrderValue(active)) active=s.key;
  });
  return active;
}

function resultFocusMatch(){
  const all=allResultMatches();
  return all.find(m=>m.live) || [...all].reverse().find(m=>m.played) || all[0] || null;
}

function resultStageFocusMatch(stageKey){
  const matches=resultMatchesForStage(stageKey);
  return matches.find(m=>m.live) || [...matches].reverse().find(m=>m.played) || null;
}

function resultsStageHtml(stage, globalFocus){
  const matches=resultMatchesForStage(stage.key);
  if(!matches.length){
    return `<div class="card empty-state">עדיין אין משחקים זמינים לשלב הזה.</div>`;
  }
  const focus=resultStageFocusMatch(stage.key) || (globalFocus && matchStageKey(globalFocus)===stage.key ? globalFocus : null);
  return `<div class="rgrid">${matches.map(m=>resultMatchCardHtml(m, focus)).join('')}</div>`;
}

function resultMatchCardHtml(m, focus){
    const result=hasResult(m);
    const points=hasPoints(m);
  const isGroup=!m.stage || m.stage==='group';
    const sc=result?`${m.hs}-${m.as}`:'vs';
  const hasTbd=!isGroup && (isTbdTeamName(m.home) || isTbdTeamName(m.away));
  const exactGuesses=((m.prediction_split||{}).total||0);
  const split=isGroup ? outcomeSplitHtml(m) : (!hasTbd && exactGuesses ? knockoutSplitHtml(m) : '');
  const tap=isGroup
    ? `<div class="mtap">${points?'הניחושים והנקודות':'הניחושים של כולם'} ›</div>`
    : (hasTbd ? '' : exactGuesses ? `<div class="mtap">${exactGuesses} ניחשו את המשחק הזה ›</div>` : `<div class="mtap no-guess">אף אחד לא ניחש את המשחק הזה</div>`);
  const click=isGroup ? ` onclick="openMatch(${m.num})"` : (!hasTbd && exactGuesses ? ` onclick="openKnockoutMatch(${m.num})"` : '');
  const noClick=!isGroup && (hasTbd || !exactGuesses);
  const latest=(focus && focus.num===m.num && matchStageKey(focus)===matchStageKey(m)) ? ` data-latest-played="true"` : '';
  return `<div class="match${result?'':' up'}${m.live?' live':''}${noClick?' no-click':''}" data-match-num="${m.num}"${latest}${click}>
     <div class="mh"><span class="mh-num">משחק ${m.num}</span><span class="mh-live">${liveLabel(m)}</span><span class="mh-date">${resultDate(m)}</span></div>
     <div class="teams"><span class="${matchSideClass(m,'home')}">${resultTeam(m.home,isGroup)}</span><span class="sc">${sc}</span><span class="${matchSideClass(m,'away')}">${resultTeam(m.away,isGroup)}</span></div>
     ${tap}
     ${split}</div>`;
}

function setResultsStageTab(key){
  curResultStage=key;
  document.querySelectorAll('#res .result-stage-tab').forEach(b=>b.classList.toggle('active',b.dataset.stage===key));
  document.querySelectorAll('#res .result-stage-panel').forEach(p=>p.classList.toggle('active',p.dataset.stage===key));
  scrollResultsStage(key);
}

function scrollResultsStage(key){
  requestAnimationFrame(()=>{
    const panel=$(`#res .result-stage-panel[data-stage="${key}"]`);
    if(!panel) return;
    const scroller=$('#res .result-stage-panels');
    const focus=panel.querySelector('[data-latest-played="true"]');
    const target=focus || panel.querySelector('.match') || panel;
    if(scroller){
      const delta=target.getBoundingClientRect().top - scroller.getBoundingClientRect().top;
      scroller.scrollTo({top:scroller.scrollTop + delta, behavior:'auto'});
    } else {
      target.scrollIntoView({block:'start'});
    }
  });
}

function outcomeSplitHtml(m){
  const s=m.outcome_split;
  if(!s || !s.total) return '';
  const pct=s.pct||{};
  const actual=hasPoints(m) ? (m.hs>m.as?'home':(m.hs<m.as?'away':'draw')) : '';
  const items=[
    {key:'home',mark:fl(m.home)||'1',label:m.home,pct:pct.home||0,count:s.home||0},
    {key:'draw',mark:'🏳️',label:'תיקו',pct:pct.draw||0,count:s.draw||0},
    {key:'away',mark:fl(m.away)||'2',label:m.away,pct:pct.away||0,count:s.away||0}
  ];
  const showFavorite=!actual;
  const maxPct=Math.max(...items.map(x=>x.pct));
  return `<div class="outcome-split" title="${s.total} ניחושים">${
    items.map(x=>`<div class="outcome-seg ${x.key}${showFavorite&&x.pct===maxPct?' fav':''}${actual===x.key?' correct':''}"
      title="${escAttr(x.label)}: ${x.count} מתוך ${s.total}">
      <span class="mark">${x.mark}</span><span class="pct">${x.pct}%</span>
    </div>`).join('')
  }</div>`;
}

function knockoutSplitHtml(m){
  const s=m.prediction_split;
  if(!s || !s.total) return '';
  const pct=s.pct||{};
  const actual=hasPoints(m) ? (m.hs>m.as?'home':(m.hs<m.as?'away':'draw')) : '';
  const items=[
    {key:'home',mark:fl(m.home)||'1',label:m.home,pct:pct.home||0,count:s.home||0},
    {key:'draw',mark:'🏳️',label:'תיקו',pct:pct.draw||0,count:s.draw||0},
    {key:'away',mark:fl(m.away)||'2',label:m.away,pct:pct.away||0,count:s.away||0}
  ];
  const showFavorite=!actual;
  const maxPct=Math.max(...items.map(x=>x.pct));
  return `<div class="outcome-split ko" title="${s.total} ניחשו את המשחק המדויק בשלב הזה">${
    items.map(x=>`<div class="outcome-seg ${x.key}${showFavorite&&x.pct===maxPct?' fav':''}${actual===x.key?' correct':''}"
      title="${escAttr(x.label)}: ${x.count} מתוך ${s.total}">
      <span class="mark">${x.mark}</span><span class="pct">${x.pct}%</span>
    </div>`).join('')
  }</div>`;
}

const STAGES=[

const STAGE_INDEX={r32:0,r16:1,qf:2,sf:3,final:4,third:4};
function uniq(arr){ return [...new Set((arr||[]).filter(Boolean))]; }
function participantStageTeams(p, key){
  if(!p) return [];
  if(key==='group'){
    const direct=(p.standings||[]).flatMap(g=>(g.rows||[]).filter(r=>r.place<=2).map(r=>r.team));
    const thirds=(p.third_places||[]).filter(r=>r.qualified).map(r=>r.team);
    return uniq(direct.concat(thirds));
  }
  return uniq(((p.bracket||{})[key]||[]).flatMap(m=>[m.t1,m.t2]));
}
function stagePopularityMap(stageKey){

  });

}
const STAGE_POPULARITY=Object.fromEntries(['r32','r16','qf','sf','final','third'].map(k=>[k,stagePopularityMap(k)]));
function stagePct(teamName, stageKey, participant){
  const total=Object.keys(D.participants||{}).length;
  if(!total) return 0;
  return Math.round(((STAGE_POPULARITY[stageKey].get(teamName)||0)/total)*100);

function knockoutRoundFromDate(dateText){
  const s=String(dateText||'');
  const m=s.match(/(?:Jun|June)\s+(\d+)|(?:Jul|July)\s+(\d+)/i);
  if(!m) return null;
  const isJul=/Jul/i.test(s), day=+(m[1]||m[2]);
  if(!isJul && day>=28) return 'r32';
  if(isJul && day<=3) return 'r32';
  if(isJul && day>=4 && day<=8) return 'r16';
  if(isJul && day>=9 && day<=12) return 'qf';
  if(isJul && day>=14 && day<=16) return 'sf';
  if(isJul && day===18) return 'third';
  if(isJul && day===19) return 'final';
  return null;
}
function knockoutNextStage(roundKey){
  return {r32:'r16',r16:'qf',qf:'sf',sf:'final'}[roundKey] || null;
}
function knockoutWinner(m, roundKey, reached){
  if(!m || m.hs==null || m.as==null) return null;
  if(m.winner) return m.winner;
  if(m.hs>m.as) return m.home;
  if(m.as>m.hs) return m.away;
  const next=knockoutNextStage(roundKey);
  if(!next) return null;
  const nextReached=(reached||{})[next] || new Set();
  const homeAdvanced=nextReached.has(m.home);
  const awayAdvanced=nextReached.has(m.away);
  if(homeAdvanced && !awayAdvanced) return m.home;
  if(awayAdvanced && !homeAdvanced) return m.away;
  return null;
}
function actualStageState(){
  const qa=((D.stats||{}).qualification_accuracy||{});
  const reachedByStage=qa.reached_teams_by_stage||{};
  const guaranteedR32=new Set(qa.guaranteed_teams||[]);
  const reached={r32:new Set(reachedByStage.r32||guaranteedR32),r16:new Set(reachedByStage.r16||[]),qf:new Set(reachedByStage.qf||[]),sf:new Set(reachedByStage.sf||[]),final:new Set(reachedByStage.final||[]),third:new Set()};
  const eliminatedFromGroup=new Set();
  const qualifiedThird=new Set((D.third_places||[]).filter(r=>r.qualified).map(r=>r.team));
  const thirdRankByTeam=new Map((D.third_places||[]).map(r=>[r.team,r.rank]));
  const completeGroups=new Set();
  (D.standings||[]).forEach(g=>{
    const rows=g.rows||[];
    const complete=rows.length && rows.every(r=>((r.W||0)+(r.D||0)+(r.L||0))>=3);
    if(complete) completeGroups.add(g.group);
  });
  const allGroupsComplete=(D.standings||[]).length>0 && completeGroups.size===(D.standings||[]).length;
  (D.standings||[]).forEach(g=>{
    const rows=g.rows||[];
    if(!completeGroups.has(g.group)) return;
    rows.forEach(r=>{
      if(r.place<=2 || qualifiedThird.has(r.team) || (allGroupsComplete && r.place===3 && (thirdRankByTeam.get(r.team)||99)<=8)){
        reached.r32.add(r.team);
      } else if(r.place>=4 || (allGroupsComplete && r.place===3 && (thirdRankByTeam.get(r.team)||99)>8)){
        eliminatedFromGroup.add(r.team);
      }
    });
  });
  const eliminatedByRound={r32:new Set(),r16:new Set(),qf:new Set(),sf:new Set(),final:new Set(),third:new Set()};
  (D.knockout_results||[]).filter(m=>m.played).forEach(m=>{
    const rk=m.stage||knockoutRoundFromDate(m.date);
    const winner=knockoutWinner(m,rk,reached);
    if(!rk || !winner) return;
    const loser=winner===m.home?m.away:m.home;
    const next=knockoutNextStage(rk);
    if(next) reached[next].add(winner);
    eliminatedByRound[rk].add(loser);
  });
  return {reached,eliminatedFromGroup,eliminatedByRound};
}
const ACTUAL_STAGE_STATE=actualStageState();
function stageStatus(teamName, stageKey){
  const key=stageKey==='group'?'r32':stageKey;
  if((ACTUAL_STAGE_STATE.reached[key]||new Set()).has(teamName)) return 'guaranteed';
  if(ACTUAL_STAGE_STATE.eliminatedFromGroup.has(teamName)) return 'eliminated';
  const idx=STAGE_INDEX[key] ?? 0;
  for(const [rk,set] of Object.entries(ACTUAL_STAGE_STATE.eliminatedByRound)){
    if((STAGE_INDEX[rk] ?? 0)<idx && set.has(teamName)) return 'eliminated';
  }
  return 'pending';
}

  $('#modal-body').innerHTML=h; $('#modal').hidden=false; $('.mm-list').scrollTop=0;

// ---- trends / rank history ----
function trendPath(points,xs,ys){
  let d='',open=false;
  points.forEach((r,i)=>{
    if(r==null){ open=false; return; }
    const x=xs(i), y=ys(r);
    d+=(open?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)+' ';
    open=true;
  });
  return d;
}
function trendEndLabels(paths,ys,top,bottom){
  const labels=paths.map(o=>{
    const li=o.ranks.map((r,i)=>r!=null?i:-1).filter(i=>i>=0).pop();
    return li==null?null:{...o,lastIndex:li,lastRank:o.ranks[li],rawY:ys(o.ranks[li]),labelY:ys(o.ranks[li])};
  }).filter(Boolean).sort((a,b)=>a.rawY-b.rawY);
  const gap=Math.max(10,Math.min(13,(bottom-top)/Math.max(labels.length-1,1)));
  labels.forEach((o,i)=>{ if(i>0)o.labelY=Math.max(o.labelY,labels[i-1].labelY+gap); });
  for(let i=labels.length-2;i>=0;i--) labels[i].labelY=Math.min(labels[i].labelY,labels[i+1].labelY-gap);
  const first=labels[0], last=labels[labels.length-1];
  const overflowTop=Math.max(0,first?top-first.labelY:0), overflowBottom=Math.max(0,(last?last.labelY:bottom)-bottom);
  labels.forEach(o=>{ o.labelY=Math.max(top,Math.min(bottom,o.labelY+overflowTop-overflowBottom)); });
  return labels;
}
function trendWeekStart(dates){
  const latest=dates[dates.length-1], parts=latest.split('-').map(Number);
  const target=new Date(Date.UTC(parts[0],parts[1]-1,parts[2]-7));
  const targetKey=target.toISOString().slice(0,10);
  return dates.filter(dt=>dt>=targetKey)[0] || dates[0];
}
function shortDate(dt){ const p=dt.split('-'); return `${p[2]}/${p[1]}`; }
function weeklyRankText(o){
  if(o.weekDelta>0) return `עלייה בשבוע האחרון מהמקום ה${o.weekStartRank} למקום ה${o.rank}`;
  if(o.weekDelta<0) return `ירידה בשבוע האחרון מהמקום ה${o.weekStartRank} למקום ה${o.rank}`;
  return `ללא שינוי השבוע, מקום ${o.rank}`;
}
function renderTrendChart(card,series,dates,maxRank,focusDefault){
  const compact=window.matchMedia && window.matchMedia('(max-width:760px)').matches;
  const W=compact?620:Math.max(1000,dates.length*98+90);
  const H=compact?430:430, m={top:compact?12:22,right:compact?88:96,bottom:compact?42:52,left:compact?38:48};
  const plotW=W-m.left-m.right, plotH=H-m.top-m.bottom;
  const xs=i=>m.left+(dates.length<=1?0:i*plotW/(dates.length-1));
  const ys=r=>m.top+((r-1)/Math.max(maxRank-1,1))*plotH;
  const yTicks=[1,Math.max(1,Math.round(maxRank*.25)),Math.max(1,Math.round(maxRank*.5)),Math.max(1,Math.round(maxRank*.75)),maxRank]
    .filter((v,i,a)=>a.indexOf(v)===i);
  const paths=series.map(o=>({...o,path:trendPath(o.ranks,xs,ys)}));
  const grid=yTicks.map(r=>`<line class="trend-grid" x1="${m.left}" x2="${W-m.right}" y1="${ys(r).toFixed(1)}" y2="${ys(r).toFixed(1)}"/>
    <text class="trend-axis-label" x="${m.left-10}" y="${(ys(r)+4).toFixed(1)}" text-anchor="end">${r}</text>`).join('');
  const dateLabels=dates.map((dt,i)=>{
    const show=!compact || i===0 || i===dates.length-1 || i%2===0;
    return `<line class="trend-grid" x1="${xs(i).toFixed(1)}" x2="${xs(i).toFixed(1)}" y1="${m.top}" y2="${H-m.bottom}"/>
      ${show?`<text class="trend-date-label" x="${xs(i).toFixed(1)}" y="${H-22}" text-anchor="middle">${shortDate(dt)}</text>`:''}`;
  }).join('');
  const lines=paths.map(o=>`<path class="trend-line" data-name="${escAttr(o.name)}" d="${o.path}" stroke="${o.color}"/>`).join('');
  const dots=paths.map(o=>{
    const li=o.ranks.map((r,i)=>r!=null?i:-1).filter(i=>i>=0).pop();
    return li==null?'':`<circle class="trend-dot" data-name="${escAttr(o.name)}" cx="${xs(li).toFixed(1)}" cy="${ys(o.ranks[li]).toFixed(1)}" r="3.4" fill="${o.color}"/>`;
  }).join('');
  const hits=paths.map(o=>`<path class="trend-hit" data-name="${escAttr(o.name)}" d="${o.path}"/>`).join('');
  const endLabels=trendEndLabels(paths,ys,m.top,H-m.bottom);
  const labelX=W-m.right+10;
  const labelGuides=endLabels.map(o=>`<line class="trend-label-guide" data-name="${escAttr(o.name)}" x1="${xs(o.lastIndex).toFixed(1)}" y1="${ys(o.lastRank).toFixed(1)}" x2="${(labelX-8).toFixed(1)}" y2="${o.labelY.toFixed(1)}" stroke="${o.color}"/>`).join('');
  const labels=endLabels.map(o=>`<text class="trend-end-label" data-name="${escAttr(o.name)}" x="${labelX.toFixed(1)}" y="${o.labelY.toFixed(1)}" text-anchor="start" fill="${o.color}">${escAttr(o.name)}</text>`).join('');
  const picker=compact?`<select class="trend-picker" aria-label="בחר משתתף">${series.map(o=>`<option value="${escAttr(o.name)}">${escAttr(o.name)} · מקום ${o.rank}</option>`).join('')}</select><div class="trend-selected-note"></div>`:'';
  card.innerHTML=`<div class="trend-chart-head"><div class="trend-focus"></div>${picker}</div>
    <div class="trend-chart-scroll"><svg class="trend-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Rank history chart">
      ${grid}${dateLabels}
      <line class="trend-axis" x1="${m.left}" x2="${m.left}" y1="${m.top}" y2="${H-m.bottom}"/>
      <line class="trend-axis" x1="${m.left}" x2="${W-m.right}" y1="${H-m.bottom}" y2="${H-m.bottom}"/>
      ${lines}${labelGuides}${dots}${labels}${hits}
    </svg></div>`;
  const focus=$('.trend-focus',card), scroll=$('.trend-chart-scroll',card), pickerEl=$('.trend-picker',card), note=$('.trend-selected-note',card);
  function setFocus(name){
    const o=series.find(x=>x.name===name); if(!o)return;
    card.classList.add('has-focus');
    focus.innerHTML=`${o.name} · מקום ${o.rank}<span class="trend-focus-note"> · ${weeklyRankText(o)}</span>`;
    if(note) note.textContent=weeklyRankText(o);
    card.querySelectorAll('[data-name]').forEach(n=>n.classList.toggle('active',n.getAttribute('data-name')===name));
    if(pickerEl && pickerEl.value!==name) pickerEl.value=name;
  }
  card.querySelectorAll('.trend-hit,.trend-end-label').forEach(p=>{
    p.onmouseenter=()=>setFocus(p.getAttribute('data-name'));
    p.onclick=()=>compact?setFocus(p.getAttribute('data-name')):openForm(p.getAttribute('data-name'));
  });
  if(pickerEl) pickerEl.onchange=()=>setFocus(pickerEl.value);
  setFocus(focusDefault.name);
  const scrollLatest=()=>{ scroll.scrollLeft=scroll.scrollWidth-scroll.clientWidth; };
  if(!compact) requestAnimationFrame(()=>{ scrollLatest(); setTimeout(scrollLatest,80); });
}
function renderTrends(){
  const v=$('#trends'); if(!v) return; v.innerHTML='';
  const dates=Object.keys(D.history||{}).sort();
  if(dates.length<2){
    v.innerHTML='<div class="card" style="padding:26px;text-align:center;color:var(--muted)">📈 המגמות מתחילות להצטבר — חזרו עוד יום-יומיים כדי לראות מי מטפס ומי צולל</div>';
    return;
  }
  const first=D.history[dates[0]], lb=D.leaderboard, maxRank=lb.length;
  const latestDate=dates[dates.length-1], weekStart=trendWeekStart(dates), weekBase=D.history[weekStart]||{};
  const colors=['#2e6fb8','#0a7a41','#e23b50','#9a7400','#7c3aed','#0891b2','#c2410c','#be185d','#4d7c0f','#4338ca','#047857','#b45309'];
  const moves=lb.map((p,i)=>{ const st=first[p.name]?first[p.name][0]:null;
    const weekStartRank=weekBase[p.name]?weekBase[p.name][0]:p.rank;
    return {name:p.name, rank:p.rank, delta:(st!=null?st-p.rank:0),
      weekStartRank, weekDelta:weekStartRank-p.rank,
      ranks:dates.map(dt=>{ const s=D.history[dt][p.name]; return s?s[0]:null; }),
      color:colors[i%colors.length]}; });
  const climber=[...moves].sort((a,b)=>b.weekDelta-a.weekDelta)[0];
  const faller=[...moves].sort((a,b)=>a.weekDelta-b.weekDelta)[0];
  v.appendChild(el('h2','sec','📈 מגמות לאורך הטורניר'));
  const hero=el('div','trend-summary');
  hero.innerHTML=`<div class="trend-card up">
      <div class="trend-title">המטפס הגדול</div>
      <div class="trend-main">${climber.name} ▲ ${Math.max(climber.weekDelta,0)} מקומות</div>
      <div class="trend-meta">עלייה בשבוע האחרון מהמקום ה${climber.weekStartRank} למקום ה${climber.rank}</div>
    </div>
    <div class="trend-card down">
      <div class="trend-title">הצניחה הגדולה</div>
      <div class="trend-main">${faller.name} ▼ ${Math.max(-faller.weekDelta,0)} מקומות</div>
      <div class="trend-meta">ירידה בשבוע האחרון מהמקום ה${faller.weekStartRank} למקום ה${faller.rank}</div>
    </div>`;
  v.appendChild(hero);
  const card=el('div','card trend-chart-card');
  renderTrendChart(card,moves,dates,maxRank,climber);
  v.appendChild(card);
}
